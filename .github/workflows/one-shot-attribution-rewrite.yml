name: One-shot attribution rewrite

on:
  push:
    paths:
      - ".github/workflows/one-shot-attribution-rewrite.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Rewrite target commit identity and force-update main
        env:
          TARGET: fa05ff8126478c022199fc152a7b90670b9fffdd
          NEW_NAME: 'OOZ OON" Kim'
          NEW_EMAIL: '71053804+WhoSia@users.noreply.github.com'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "$NEW_NAME"
          git config user.email "$NEW_EMAIL"
          git checkout -B main origin/main

          git filter-branch -f --env-filter '
            if [ "$GIT_COMMIT" = "$TARGET" ]; then
              export GIT_AUTHOR_NAME="$NEW_NAME"
              export GIT_AUTHOR_EMAIL="$NEW_EMAIL"
              export GIT_COMMITTER_NAME="$NEW_NAME"
              export GIT_COMMITTER_EMAIL="$NEW_EMAIL"
            fi
          ' -- main

          if git log main --format="%an <%ae> %cn <%ce>" | grep -qi "github-actions"; then
            echo "github-actions attribution still present on rewritten main"
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin +main:main
