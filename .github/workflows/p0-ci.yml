name: P0 MCP smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q server.py test_client.py

      - name: Start Streamable HTTP MCP server
        env:
          P0_WRITE_NONCE: ci-only
        run: |
          python server.py > /tmp/mcp.log 2>&1 &
          echo $! > /tmp/mcp.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json

      - name: MCP client handshake and read probe
        env:
          MCP_URL: http://127.0.0.1:8000/mcp
        run: python test_client.py

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mcp.log || true
