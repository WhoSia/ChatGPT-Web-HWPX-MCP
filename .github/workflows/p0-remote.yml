name: P0 Render remote MCP verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://chatgpt-web-hwpx-mcp-p0.onrender.com
      MCP_URL: https://chatgpt-web-hwpx-mcp-p0.onrender.com/mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Render health endpoint
        run: |
          for i in {1..36}; do
            if curl --fail --silent --show-error "$BASE_URL/health" | tee /tmp/health.json; then
              echo
              exit 0
            fi
            echo "Render not healthy yet ($i/36); retrying..."
            sleep 5
          done
          exit 1

      - name: Verify MCP handshake, tool discovery, and read probe
        run: python test_client.py
