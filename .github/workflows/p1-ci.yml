name: P1.1 OAuth HWPX lifecycle CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q server.py oauth_provider.py test_client.py test_p1.py

      - name: HWPX unit tests
        env:
          P1_PUBLIC_BASE_URL: http://127.0.0.1:8000
          P11_OAUTH_PASSPHRASE: ci-p11-oauth-passphrase
          P1_DOWNLOAD_SECRET: ci-download-secret
        run: python -m unittest -v test_p1.py

      - name: Start OAuth-protected Streamable HTTP MCP server
        env:
          P1_PUBLIC_BASE_URL: http://127.0.0.1:8000
          P11_OAUTH_PASSPHRASE: ci-p11-oauth-passphrase
          P1_DOWNLOAD_SECRET: ci-download-secret
        run: |
          python server.py > /tmp/mcp.log 2>&1 &
          echo $! > /tmp/mcp.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mcp.log || true
          exit 1

      - name: Verify unauthenticated MCP is rejected and discovery is published
        run: |
          status="$(curl --silent --output /tmp/unauth.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8000/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"ping"}')"
          test "$status" = "401"
          cat /tmp/unauth.json
          curl --fail --silent http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp | tee /tmp/prm.json
          grep -q '"hwpx"' /tmp/prm.json

      - name: OAuth-native MCP document lifecycle and signed download receipt
        env:
          MCP_URL: http://127.0.0.1:8000/mcp
          P11_OAUTH_PASSPHRASE: ci-p11-oauth-passphrase
          RUN_P11_WRITE_TEST: "1"
        run: python test_client.py

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mcp.log || true
