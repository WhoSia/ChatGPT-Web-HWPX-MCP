name: P3.6 Durable concurrency HWPX CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hwpx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hwpx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      P1_PUBLIC_BASE_URL: http://127.0.0.1:8000
      P11_OAUTH_PASSPHRASE: ci-p2-oauth-passphrase
      P1_DOWNLOAD_SECRET: ci-download-secret
      P12_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hwpx
      P12_STATE_SECRET: ci-p12-state-secret-0123456789-abcdefghijklmnopqrstuvwxyz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q server.py server_p2.py p2_document.py p22_formatting.py p23_richtext.py p24_inline.py p25_controls.py p26_controls.py p27_tables.py p28_tables.py p29_objects.py p210_equations.py hwp5_reader.py common_ir.py document_store.py oauth_provider.py auth_store.py test_client.py test_p1.py test_p2.py test_hwp5_reader.py test_common_ir.py test_auth_store.py test_document_store.py

      - name: HWPX admission, durable auth, and P3.6 transaction unit tests
        run: python -m unittest -v test_p1.py test_p2.py test_hwp5_reader.py test_common_ir.py test_auth_store.py test_document_store.py

      - name: Start P3.6 OAuth-protected Streamable HTTP MCP server
        run: |
          python server_p2.py > /tmp/mcp.log 2>&1 &
          echo $! > /tmp/mcp.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/tmp/health.json; then
              cat /tmp/health.json
              grep -q '0.6.0-p3.6' /tmp/health.json
              grep -q 'postgres-encrypted' /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mcp.log || true
          exit 1

      - name: Verify unauthenticated MCP is rejected and discovery is published
        run: |
          status="$(curl --silent --output /tmp/unauth.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8000/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"ping"}')"
          test "$status" = "401"
          curl --fail --silent http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp | tee /tmp/prm.json
          grep -q '"hwpx"' /tmp/prm.json
          curl --fail --silent http://127.0.0.1:8000/.well-known/oauth-authorization-server | tee /tmp/as.json
          grep -q 'offline_access' /tmp/as.json

      - name: OAuth-native map, edit, diff, export, re-ingest, and cleanup
        env:
          MCP_URL: http://127.0.0.1:8000/mcp
          RUN_P2_WRITE_TEST: "1"
        run: python test_client.py

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mcp.log || true
