name: HWPX MCP lifecycle and fidelity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "tests/**"
      - "hwpx_mcp/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "server.py"
      - "server_p2.py"
      - "p418_mcp.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hwpx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hwpx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      P1_PUBLIC_BASE_URL: http://127.0.0.1:8000
      P11_OAUTH_PASSPHRASE: ci-p2-oauth-passphrase
      P1_DOWNLOAD_SECRET: ci-download-secret
      P12_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hwpx
      P12_STATE_SECRET: ci-p12-state-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      P414_ALLOW_TEST_RECEIPTS: "1"
      P345_TS_RUNTIME: ${{ github.workspace }}/.tmp/p345-ts/scripts/p345_runtime_cli.js
      P345_REPLAY_BIN: ${{ github.workspace }}/rust/p345_replay/target/release/p345-replay
      P346_TS_RUNTIME: ${{ github.workspace }}/.tmp/p346-ts/scripts/p346_platform_cli.js
      P346_GUARD_BIN: ${{ github.workspace }}/rust/p346_guard/target/release/p346-guard
      P347_TS_RUNTIME: ${{ github.workspace }}/.tmp/p347-ts/scripts/p347_supply_chain_cli.js
      P347_CERTIFIER_BIN: ${{ github.workspace }}/rust/p347_certifier/target/release/p347-certifier
      P348_TS_RUNTIME: ${{ github.workspace }}/.tmp/p348-ts/scripts/p348_marketplace_cli.js
      P348_VERIFIER_BIN: ${{ github.workspace }}/rust/p348_marketplace_verifier/target/release/p348-marketplace-verifier
      P349_TS_RUNTIME: ${{ github.workspace }}/.tmp/p349-ts/scripts/p349_composition_cli.js

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-capture.txt -r requirements-dev.txt

      - name: Build P3.45 runtime plus P3.46/P3.47/P3.48/P3.49 platform kernels
        run: |
          rm -rf .tmp/p345-ts .tmp/p346-ts .tmp/p347-ts .tmp/p348-ts .tmp/p349-ts
          mkdir -p .tmp/p345-ts .tmp/p346-ts .tmp/p347-ts .tmp/p348-ts .tmp/p349-ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p345-ts contracts/p345_runtime.ts contracts/p345_extension_sdk.ts scripts/p345_runtime_cli.ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p346-ts contracts/p346_capability_kernel.ts contracts/p346_extension_sdk.ts scripts/p346_platform_cli.ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p347-ts contracts/p346_capability_kernel.ts contracts/p347_supply_chain_kernel.ts scripts/p347_supply_chain_cli.ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p348-ts contracts/p346_capability_kernel.ts contracts/p348_marketplace_kernel.ts scripts/p348_marketplace_cli.ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p349-ts contracts/p349_composition_kernel.ts scripts/p349_composition_cli.ts
          cargo build --release --manifest-path rust/p345_replay/Cargo.toml
          cargo build --release --manifest-path rust/p346_guard/Cargo.toml
          cargo build --release --manifest-path rust/p347_certifier/Cargo.toml
          cargo build --release --manifest-path rust/p348_marketplace_verifier/Cargo.toml

      - name: Compile Python sources
        run: python -m compileall -q server.py server_p2.py p2_document.py p22_formatting.py p23_richtext.py p24_inline.py p25_controls.py p26_controls.py p27_tables.py p28_tables.py p29_objects.py p210_equations.py hwp5_reader.py common_ir.py p311_layout_fidelity.py p312_render_harness.py p313_capture_custody.py p313r1_fixture_pack.py p314_capture_intake.py p315_cross_version.py p315_replay_builder.py p316_version_indexed.py p316_stability_builder.py p317_fidelity_envelope.py p317_page_geometry.py hwpx_mcp/corpus/p317_regression_corpus.py p318_document_setup.py hwpx_mcp/corpus/p318_regression_corpus.py p319_structured_publishing.py hwpx_mcp/corpus/p319_regression_corpus.py p320_annotation_apparatus.py hwpx_mcp/corpus/p320_regression_corpus.py p321_document_composer.py hwpx_mcp/corpus/p321_regression_corpus.py p322_review_workflow.py hwpx_mcp/corpus/p322_regression_corpus.py p323_advanced_tables.py hwpx_mcp/corpus/p323_regression_corpus.py p324_story_layer.py hwpx_mcp/corpus/p324_regression_corpus.py p325_drawing_layer.py hwpx_mcp/corpus/p325_regression_corpus.py p326_drawing_style.py hwpx_mcp/corpus/p326_regression_corpus.py p327_diagram_composition.py hwpx_mcp/corpus/p327_regression_corpus.py p328_high_level_diagrams.py hwpx_mcp/corpus/p328_regression_corpus.py p329_diagram_lifecycle.py hwpx_mcp/corpus/p329_regression_corpus.py p330_diagram_design_system.py hwpx_mcp/corpus/p330_regression_corpus.py p331_diagram_quality_assurance.py hwpx_mcp/corpus/p331_regression_corpus.py p332_brownfield_diagrams.py hwpx_mcp/corpus/p332_regression_corpus.py p335_typography.py p335_paragraph.py p335_corpus.py p335_registry.py p335_visual.py p335_atlas.py p335_mcp.py p336_corpus.py p336r2_design.py p337_product_workflow.py p338_rich_builder.py p339_design_intelligence.py p340_feedback_loop.py p341_page_composition.py p342_mutation_footprint.py p342_corpus_evidence.py p342_mcp.py p343_design_system.py hwpx_mcp/interfaces/p343_mcp.py p344_autonomous_authoring.py p344_mcp.py p345_runt