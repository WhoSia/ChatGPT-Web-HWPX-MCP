name: P2.9 Render public boundary verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://chatgpt-web-hwpx-mcp-p0.onrender.com
      MCP_URL: https://chatgpt-web-hwpx-mcp-p0.onrender.com/mcp
      CURL: curl --http1.1 --retry 3 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 20

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Render P2.9 server
        run: |
          for i in {1..36}; do
            body="$($CURL --fail --silent --show-error "$BASE_URL/health" || true)"
            if echo "$body" | grep -q '0.3.9-p2.9' && \
               echo "$body" | grep -q 'postgres-encrypted' && \
               echo "$body" | grep -q '"durable_store_reachable":true'; then
              echo "$body"
              exit 0
            fi
            echo "Render P2.9 not ready yet ($i/36): $body"
            sleep 5
          done
          exit 1

      - name: Verify protected-resource metadata
        run: |
          $CURL --fail --silent --show-error \
            "$BASE_URL/.well-known/oauth-protected-resource/mcp" | tee /tmp/prm.json
          grep -q '"resource":"https://chatgpt-web-hwpx-mcp-p0.onrender.com/mcp"' /tmp/prm.json
          grep -q '"hwpx"' /tmp/prm.json

      - name: Verify authorization-server metadata and offline access
        run: |
          $CURL --fail --silent --show-error \
            "$BASE_URL/.well-known/oauth-authorization-server" | tee /tmp/as.json
          grep -q '"authorization_endpoint"' /tmp/as.json
          grep -q '"token_endpoint"' /tmp/as.json
          grep -q '"registration_endpoint"' /tmp/as.json
          grep -q '"offline_access"' /tmp/as.json

      - name: Verify unauthenticated MCP request is rejected before tool execution
        run: |
          status="$($CURL --silent --output /tmp/unauth.json --write-out '%{http_code}' \
            -X POST "$MCP_URL" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"ping"}')"
          cat /tmp/unauth.json
          test "$status" = "401"
