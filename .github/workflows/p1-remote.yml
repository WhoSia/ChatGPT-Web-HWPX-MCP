name: Production Render public boundary verification
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production-boundary
  cancel-in-progress: true
jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact release and protected-resource boundary
        run: python scripts/verify_production_boundary.py --base-url https://chatgpt-web-hwpx-mcp-p0.onrender.com --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-boundary-receipt
          path: production-boundary.json
