name: P3.41 page-composition polyglot validation

on:
  push:
    branches: [main]
    paths:
      - "p341_page_composition.py"
      - "p321_document_composer.py"
      - "test_p321_document_composer.py"
      - "p339_design_intelligence.py"
      - "test_p339_design_intelligence.py"
      - "p340_feedback_loop.py"
      - "test_p340_feedback_loop.py"
      - "test_p341_page_composition.py"
      - "benchmarks/p341_*"
      - "rust/p341_page_geometry/**"
      - "contracts/p341_page_composition.ts"
      - "server_p2.py"
      - "test_client.py"
      - "scripts/p341_*"
      - "benchmarks/authorbench_a3*"
      - "skills/hwpx-authoring/SKILL.md"
      - "P341_TEST_LEDGER.md"
      - ".github/workflows/p341-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "p341_page_composition.py"
      - "p321_document_composer.py"
      - "test_p321_document_composer.py"
      - "p339_design_intelligence.py"
      - "test_p339_design_intelligence.py"
      - "p340_feedback_loop.py"
      - "test_p340_feedback_loop.py"
      - "test_p341_page_composition.py"
      - "benchmarks/p341_*"
      - "rust/p341_page_geometry/**"
      - "contracts/p341_page_composition.ts"
      - "server_p2.py"
      - "test_client.py"
      - "scripts/p341_*"
      - "benchmarks/authorbench_a3*"
      - "skills/hwpx-authoring/SKILL.md"
      - "P341_TEST_LEDGER.md"
      - ".github/workflows/p341-ci.yml"

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-capture.txt -r requirements-dev.txt
      - name: Compile P3.41 product surface
        run: python -m compileall -q p321_document_composer.py p339_design_intelligence.py p340_feedback_loop.py p341_page_composition.py p341r1_capture_pack.py test_p321_document_composer.py test_p339_design_intelligence.py test_p340_feedback_loop.py test_p341_page_composition.py test_p341r1_capture_pack.py server_p2.py test_client.py benchmarks/authorbench_a3.py benchmarks/authorbench_a3_p341_evaluation.py scripts/p341_release_smoke.py scripts/p341r1_materialize_capture_pack.py scripts/p341r1_capture_pdf.py scripts/p341r1_finalize_capture_pack.py scripts/p341r1_verify_frozen_a3.py
      - name: Python P3.41 regression
        run: python -m pytest -q test_p339_design_intelligence.py test_p340_feedback_loop.py test_p341_page_composition.py test_p341r1_capture_pack.py
      - name: P3.41 release smoke
        run: python scripts/p341_release_smoke.py

  rust-exact-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust golden-fixture parity
        run: cargo test --manifest-path rust/p341_page_geometry/Cargo.toml --locked

  typescript-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: TypeScript contract check
        run: npx --yes -p typescript@5.9.2 tsc --noEmit --strict --target ES2022 contracts/p341_page_composition.ts

  windows-capture-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse P3.41-R1 PowerShell capture surface
        shell: powershell
        run: |
          $files = @(
            ".\\scripts\\common\\HancomExport.ps1",
            ".\\scripts\\p341r1_run_authorbench_hancom_capture.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          . .\\scripts\\common\\HancomExport.ps1
          if (-not (Get-Command Find-HwpxHancomExe -ErrorAction SilentlyContinue)) { exit 1 }
          if (-not (Get-Command Export-HwpxHancomPdfWithRetry -ErrorAction SilentlyContinue)) { exit 1 }

  authorbench-a3:
    needs: [python-reference, rust-exact-kernel, typescript-contract, windows-capture-bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install authoring dependencies
        run: pip install -r requirements.txt -r requirements-capture.txt -r requirements-dev.txt
      - name: Generate A3 only after all polyglot gates pass
        run: python benchmarks/authorbench_a3.py
      - name: Preserve first-pass A3 before adjudication
        uses: actions/upload-artifact@v4
        with:
          name: authorbench-a3-p341-first-pass
          path: |
            artifacts/authorbench-a3-*.hwpx
            artifacts/authorbench-a3-receipt.json
          if-no-files-found: error
      - name: Evaluate fresh cross-archetype A3
        run: python benchmarks/authorbench_a3_p341_evaluation.py
      - name: Verify native HWPX packages
        if: always()
        run: |
          unzip -t artifacts/authorbench-a3-research-brief.hwpx
          unzip -t artifacts/authorbench-a3-institutional-report.hwpx
          unzip -t artifacts/authorbench-a3-academic-report.hwpx
      - name: Preserve A3 adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorbench-a3-p341-adjudication
          path: |
            artifacts/authorbench-a3-receipt.json
            artifacts/authorbench-a3-p341-evaluation.json
          if-no-files-found: warn
