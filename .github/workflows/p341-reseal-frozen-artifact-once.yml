name: P3.41 one-shot frozen A3 artifact reseal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p341-reseal-frozen-artifact-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact original Actions artifact envelope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10885019734/zip" \
            -o /tmp/authorbench-a3-p341-first-pass.zip
          echo "c3f737403a914fd5c3da4ff33ca8ef2d8d2378818fa566434d548cd7680542b9  /tmp/authorbench-a3-p341-first-pass.zip" | sha256sum -c -
          test "$(stat -c%s /tmp/authorbench-a3-p341-first-pass.zip)" = "30497"
      - name: Reseal exact bytes into repository shards
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, zipfile

          source = Path("/tmp/authorbench-a3-p341-first-pass.zip")
          payload = source.read_bytes()
          assert hashlib.sha256(payload).hexdigest() == "c3f737403a914fd5c3da4ff33ca8ef2d8d2378818fa566434d548cd7680542b9"
          with zipfile.ZipFile(source, "r") as z:
              bad = z.testzip()
              assert bad is None, f"original artifact CRC failure: {bad}"

          encoded = base64.b64encode(payload).decode("ascii")
          assert len(encoded) == 40664
          root = Path("benchmarks/frozen/p341")
          root.mkdir(parents=True, exist_ok=True)
          for index in range(5):
              chunk = encoded[index * 9000:(index + 1) * 9000]
              expected = 4664 if index == 4 else 9000
              assert len(chunk) == expected
              (root / f"authorbench-a3-p341-first-pass.zip.b64.{index:02d}").write_text(chunk, encoding="ascii")
          PY
      - name: Verify reconstructed artifact before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, zipfile

          root = Path("benchmarks/frozen/p341")
          encoded = "".join(
              (root / f"authorbench-a3-p341-first-pass.zip.b64.{i:02d}").read_text(encoding="ascii")
              for i in range(5)
          )
          payload = base64.b64decode(encoded, validate=True)
          assert len(payload) == 30497
          assert hashlib.sha256(payload).hexdigest() == "c3f737403a914fd5c3da4ff33ca8ef2d8d2378818fa566434d548cd7680542b9"
          with zipfile.ZipFile(io.BytesIO(payload), "r") as z:
              bad = z.testzip()
              assert bad is None, f"resealed artifact CRC failure: {bad}"
          PY
      - name: Commit repaired shards to canonical main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/frozen/p341/authorbench-a3-p341-first-pass.zip.b64.*
          if git diff --cached --quiet; then
            echo "Exact shards already present."
            exit 0
          fi
          git commit -m "P3.41-R1 — reseal exact original A3 workflow artifact bytes"
          git push origin HEAD:main
