name: P4.10 native visual closure

on:
  push:
    branches: [main]
    paths:
      - "p410_*"
      - "test_p410_*"
      - "scripts/p410_*"
      - "p49_*"
      - "scripts/p49_*"
      - "p48_mcp.py"
      - "server_p2.py"
      - "tests/test_client.py"
      - "Dockerfile"
      - "scripts/verify_production_boundary.py"
      - ".github/workflows/p410-ci.yml"
      - ".github/workflows/p1-ci.yml"
      - ".github/workflows/p1-remote.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q p410_closure.py tests/test_p410_closure.py tests/test_p410_native_closure_pack.py scripts/p410_release_smoke.py scripts/p410_materialize_native_closure_pack.py p49_visual_conformance.py p49_equation_witnesses.py
      - run: python -m pytest -q tests/test_p410_closure.py tests/test_p410_native_closure_pack.py tests/test_p49_visual_conformance.py tests/test_p49_equation_witnesses.py tests/test_p49_capture_contract.py
      - run: python scripts/p49_release_smoke.py
      - run: python scripts/p410_release_smoke.py
      - run: python scripts/p48_component_benchmark.py --out /tmp/p410-component-benchmark
      - run: python scripts/p49_materialize_equation_witnesses.py --out /tmp/p410-equation-witness
      - run: python scripts/p410_materialize_native_closure_pack.py --out /tmp/p410-native-closure-pack
      - uses: actions/upload-artifact@v4
        with:
          name: p410-closure-evidence
          path: |
            /tmp/p410-component-benchmark
            /tmp/p410-equation-witness
            /tmp/p410-native-closure-pack

  docker-exact-head:
    runs-on: ubuntu-latest
    needs: closure-static
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t hwpx-mcp-p410:${{ github.sha }} .
      - run: docker run --rm --entrypoint python hwpx-mcp-p410:${{ github.sha }} scripts/p410_release_smoke.py
