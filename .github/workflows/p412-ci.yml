name: P4.12 native visual defect eradication

on:
  push:
    branches: [main]
    paths:
      - "p412_*"
      - "test_p412_*"
      - "scripts/p412_*"
      - "hwpx_mcp/interfaces/p48_mcp.py"
      - "tests/test_p48_mcp.py"
      - "scripts/p48_component_benchmark.py"
      - "scripts/p48_release_smoke.py"
      - "scripts/p49_release_smoke.py"
      - "server_p2.py"
      - "tests/test_client.py"
      - "Dockerfile"
      - "scripts/verify_production_boundary.py"
      - ".github/workflows/p412-ci.yml"
      - ".github/workflows/p1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q hwpx_mcp/rendering/p412_native_repair.py hwpx_mcp/interfaces/p412_mcp.py tests/test_p412_native_repair.py scripts/p412_release_smoke.py scripts/p412_materialize_native_repair_pack.py hwpx_mcp/interfaces/p48_mcp.py tests/test_p48_mcp.py
      - run: python -m pytest -q tests/test_p412_native_repair.py tests/test_p48_mcp.py
      - run: python scripts/p49_release_smoke.py
      - run: python scripts/p412_release_smoke.py
      - run: python scripts/p48_component_benchmark.py --out /tmp/p412-component-benchmark
      - run: python scripts/p412_materialize_native_repair_pack.py --out /tmp/p412-native-rerender-pack --exact-head ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: p412-native-rerender-pack
          path: |
            /tmp/p412-component-benchmark
            /tmp/p412-native-rerender-pack

  docker-exact-head:
    runs-on: ubuntu-latest
    needs: repair-kernel
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t hwpx-mcp-p412:${{ github.sha }} .
      - run: docker run --rm --entrypoint python hwpx-mcp-p412:${{ github.sha }} scripts/p412_release_smoke.py
