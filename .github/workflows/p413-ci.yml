name: P4.13 continuous Hancom evidence and trust

on:
  push:
    branches: [main]
    paths:
      - "p413_*"
      - "test_p413_*"
      - "scripts/p413_*"
      - "benchmarks/p412_native_requalification.json"
      - "server_p2.py"
      - "tests/test_client.py"
      - "Dockerfile"
      - "scripts/verify_production_boundary.py"
      - ".github/workflows/p413-ci.yml"
      - ".github/workflows/p1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q hwpx_mcp/evidence/p413_evidence_service.py hwpx_mcp/interfaces/p413_mcp.py tests/test_p413_evidence_service.py scripts/p413_release_smoke.py scripts/p413_materialize_release_evidence.py
      - run: python -m pytest -q tests/test_p413_evidence_service.py
      - run: python scripts/p413_release_smoke.py
      - run: python scripts/p413_materialize_release_evidence.py --out /tmp/p413-release-evidence --exact-head ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: p413-release-evidence
          path: /tmp/p413-release-evidence

  docker-exact-head:
    runs-on: ubuntu-latest
    needs: evidence-service
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t hwpx-mcp-p413:${{ github.sha }} .
      - run: docker run --rm --entrypoint python hwpx-mcp-p413:${{ github.sha }} scripts/p413_release_smoke.py
