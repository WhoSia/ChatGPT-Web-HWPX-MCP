name: P4.14 distributed native evidence and trust

on:
  push:
    branches: [main]
    paths:
      - "p414_*"
      - "p414_evidence_store.sql"
      - "test_p414_*"
      - "test_p335_registry_atlas.py"
      - "scripts/p414_*"
      - "benchmarks/p414_*"
      - "server.py"
      - "durable_health.py"
      - "test_durable_health.py"
      - "server_p2.py"
      - "test_client.py"
      - "Dockerfile"
      - "scripts/verify_production_boundary.py"
      - ".github/workflows/p414-ci.yml"
      - ".github/workflows/p1-ci.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hwpx_p414_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d hwpx_p414_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      P414_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hwpx_p414_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q durable_health.py test_durable_health.py server.py p414_evidence_service.py p414_evidence_store.py p414_mcp.py test_p414_production_boundary.py test_p414_evidence_service.py test_p414_evidence_store.py test_p414_docker_layer_budget.py scripts/verify_production_boundary.py scripts/p414_release_smoke.py scripts/p414_materialize_release_evidence.py scripts/p414_materialize_capture_job.py scripts/p414_sign_receipt.py
      - run: python -m pytest -q test_durable_health.py test_p414_production_boundary.py test_p414_evidence_service.py test_p414_evidence_store.py test_p414_docker_layer_budget.py
      - run: python scripts/p414_release_smoke.py
      - run: python scripts/p414_materialize_release_evidence.py --out /tmp/p414-release-evidence --exact-head ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: p414-release-evidence
          path: /tmp/p414-release-evidence

  oauth-full-lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hwpx_p414_lifecycle
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d hwpx_p414_lifecycle"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      P12_AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hwpx_p414_lifecycle
      P30_DOCUMENT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hwpx_p414_lifecycle
      P414_EVIDENCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hwpx_p414_lifecycle
      P12_STATE_SECRET: p414-ci-state-secret-not-a-production-secret-32-chars-minimum
      P11_OAUTH_PASSPHRASE: p414-ci-oauth-approval-passphrase-not-production
      P1_DOWNLOAD_SECRET: p414-ci-download-secret-not-production
      P1_OBJECT_DIR: /tmp/p414-lifecycle-objects
      MCP_URL: http://127.0.0.1:8000/mcp
      P414_RELEASE_EXACT_HEAD: ${{ github.sha }}
      RENDER_GIT_COMMIT: ${{ github.sha }}
      P414_ALLOW_TEST_RECEIPTS: "1"
      RUN_P2_WRITE_TEST: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      P345_TS_RUNTIME: ${{ github.workspace }}/.tmp/p345-ts/scripts/p345_runtime_cli.js
      P345_REPLAY_BIN: ${{ github.workspace }}/rust/p345_replay/target/release/p345-replay
      P346_TS_RUNTIME: ${{ github.workspace }}/.tmp/p346-ts/scripts/p346_platform_cli.js
      P346_GUARD_BIN: ${{ github.workspace }}/rust/p346_guard/target/release/p346-guard
      P347_TS_RUNTIME: ${{ github.workspace }}/.tmp/p347-ts/scripts/p347_supply_chain_cli.js
      P347_CERTIFIER_BIN: ${{ github.workspace }}/rust/p347_certifier/target/release/p347-certifier
      P348_TS_RUNTIME: ${{ github.workspace }}/.tmp/p348-ts/scripts/p348_marketplace_cli.js
      P348_VERIFIER_BIN: ${{ github.workspace }}/rust/p348_marketplace_verifier/target/release/p348-marketplace-verifier
      P349_TS_RUNTIME: ${{ github.workspace }}/.tmp/p349-ts/scripts/p349_composition_cli.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Build inherited P3.45–P3.49 runtimes required by server registration
        run: |
          rm -rf .tmp/p345-ts .tmp/p346-ts .tmp/p347-ts .tmp/p348-ts .tmp/p349-ts
          mkdir -p .tmp/p345-ts .tmp/p346-ts .tmp/p347-ts .tmp/p348-ts .tmp/p349-ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p345-ts contracts/p345_runtime.ts contracts/p345_extension_sdk.ts scripts/p345_runtime_cli.ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p346-ts contracts/p346_capability_kernel.ts contracts/p346_extension_sdk.ts scripts/p346_platform_cli.ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p347-ts contracts/p346_capability_kernel.ts contracts/p347_supply_chain_kernel.ts scripts/p347_supply_chain_cli.ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p348-ts contracts/p346_capability_kernel.ts contracts/p348_marketplace_kernel.ts scripts/p348_marketplace_cli.ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p349-ts contracts/p349_composition_kernel.ts scripts/p349_composition_cli.ts
          cargo build --release --manifest-path rust/p345_replay/Cargo.toml
          cargo build --release --manifest-path rust/p346_guard/Cargo.toml
          cargo build --release --manifest-path rust/p347_certifier/Cargo.toml
          cargo build --release --manifest-path rust/p348_marketplace_verifier/Cargo.toml
      - name: Start the exact-head service
        run: |
          python server_p2.py > /tmp/p414-server.log 2>&1 &
          echo $! > /tmp/p414-server.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/health > /tmp/p414-health.json; then break; fi
            sleep 2
          done
          cat /tmp/p414-health.json
          python -c "import json; x=json.load(open('/tmp/p414-health.json')); assert x['phase'] in {'P4.14','P4.15'} and x['version'] in {'0.39.0-p4.14','0.40.0-p4.15'} and x['p414_evidence']['durable_store_reachable'] is True"
      - name: Full OAuth and MCP lifecycle
        run: python test_client.py
      - if: always()
        run: cat /tmp/p414-server.log

  docker-exact-head:
    runs-on: ubuntu-latest
    needs: [evidence-service, oauth-full-lifecycle]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t hwpx-mcp-p414:${{ github.sha }} .
      - run: docker run --rm --entrypoint python hwpx-mcp-p414:${{ github.sha }} scripts/p414_release_smoke.py
      - run: docker run --rm --entrypoint python hwpx-mcp-p414:${{ github.sha }} scripts/p413_release_smoke.py
