name: P4.17 corpus-grounded document intelligence

on:
  push:
    branches: [main]
    paths:
      - "p417_*.py"
      - "test_p417_*.py"
      - "scripts/p417_*.py"
      - "benchmarks/p417_*"
      - ".github/workflows/p417-ci.yml"
      - "server_p2.py"
      - "test_client.py"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile P4.17 corpus kernel
        run: python -m py_compile p417_corpus.py p417_semantics.py p417_planner.py p417_executor.py p417_mcp.py scripts/p417_acquire_corpus.py
      - name: P4.17 corpus intelligence tests
        run: python -m pytest -q test_p417_corpus.py test_p417_semantics.py test_p417_planner.py test_p417_executor.py

  live-official-corpus:
    # P4.17-P1 is HOLD-CLOSED. Keep the frozen 4-doc / 2-institution
    # criterion visible, but do not let an acquisition transport failure
    # block successor implementation phases.
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [corpus-kernel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire bounded official HWPX corpus
        run: python scripts/p417_acquire_corpus.py --out /tmp/p417-official-corpus.json --minimum-documents 4 --minimum-institutions 2 --sleep-seconds 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p417-official-corpus
          path: /tmp/p417-official-corpus.json
          if-no-files-found: ignore

  docker-exact-head:
    runs-on: ubuntu-latest
    needs: [corpus-kernel]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact-head image
        run: docker build --progress=plain -t hwpx-mcp-p417:${{ github.sha }} .
      - name: Verify P4.17 intelligence and execution kernels in exact-head image
        run: docker run --rm --entrypoint python hwpx-mcp-p417:${{ github.sha }} -c "from p417_corpus import corpus_contract; from p417_executor import transformation_execution_contract; c=corpus_contract(); e=transformation_execution_contract(); assert c['phase']=='P4.17' and c['product']=='0.42.0-p4.17' and c['raw_bytes_policy']=='EPHEMERAL_ONLY_BY_DEFAULT'; assert e['phase']=='P4.17' and e['product']=='0.42.0-p4.17' and e['transaction']=='COPY_EXECUTE_VERIFY_ATOMIC_REPLACE'; print('P4.17 corpus + verified execution Docker PASS')"
      - name: Preserve P4.16 backward authority smoke
        run: docker run --rm --entrypoint python hwpx-mcp-p417:${{ github.sha }} scripts/p416_release_smoke.py
