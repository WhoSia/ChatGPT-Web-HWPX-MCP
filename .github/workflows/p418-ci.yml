name: P4.18 end-user document agent product

on:
  push:
    branches: [main]
    paths:
      - "p418_*.py"
      - "test_p418_*.py"
      - "tests/test_p418_p2_workflow.py"
      - "hwpx_mcp/**"
      - "p417_mcp.py"
      - "server_p2.py"
      - "test_client.py"
      - "Dockerfile"
      - ".github/workflows/p418-ci.yml"
  pull_request:
    paths:
      - "p418_*.py"
      - "test_p418_*.py"
      - ".github/workflows/p418-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p418-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile P4.18 product facade
        run: python -m py_compile p418_product.py p418_mcp.py hwpx_mcp/orchestration/p418_p2_workflow.py hwpx_mcp/orchestration/p418_p2_preview.py hwpx_mcp/orchestration/p418_p2_admission.py p417_mcp.py server_p2.py
      - name: P4.18 product task tests
        run: python -m pytest -q test_p418_product.py tests/test_p418_p2_workflow.py tests/test_p418_p2_preview.py tests/test_p418_p2_staging.py test_p417_planner.py test_p417_executor.py

  p2-postgres-admission:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hwpx_test
          POSTGRES_PASSWORD: hwpx_test_password
          POSTGRES_DB: hwpx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hwpx_test -d hwpx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P418_P2_TEST_DATABASE_URL: postgresql://hwpx_test:hwpx_test_password@127.0.0.1:5432/hwpx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test P2 Durable Approval And Recovery
        run: python -m pytest -q tests/test_p418_p2_admission.py

  docker-exact-head:
    runs-on: ubuntu-latest
    needs: [product-kernel, p2-postgres-admission]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact-head image
        run: docker build --progress=plain -t hwpx-mcp-p418:${{ github.sha }} .
      - name: Verify P4.18 product contract and release identity
        run: docker run --rm --entrypoint python hwpx-mcp-p418:${{ github.sha }} -c "from pathlib import Path; from p418_product import document_agent_contract; c=document_agent_contract(); assert c['phase']=='P4.18' and c['product']=='0.43.0-p4.18' and c['product_goal']=='ONE_PRIMARY_TASK_SURFACE_OVER_VERIFIED_EXISTING_HWPX_CAPABILITIES'; s=Path('/app/server_p2.py').read_text(encoding='utf-8'); assert 'P2_VERSION = \"0.43.0-p4.18\"' in s and 'core.PHASE = \"P4.18\"' in s; print('P4.18 product facade Docker PASS')"
