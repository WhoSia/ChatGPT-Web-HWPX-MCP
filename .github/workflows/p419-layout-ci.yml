name: P4.19 repository layout and full-suite regression

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "hwpx_mcp/**"
      - "server_p2.py"
      - "p418_mcp.py"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "scripts/p419_layout_audit.py"
      - ".github/workflows/p419-layout-ci.yml"
      - "hwpx_mcp/**"
      - "server_p2.py"
      - "p418_mcp.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p419-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify package-first repository layout
        run: python scripts/p419_layout_audit.py
      - name: Compile moved tests and consolidated product module
        run: python -m compileall -q tests hwpx_mcp/orchestration/p419_product.py scripts/p419_layout_audit.py

  complete-python-regression:
    runs-on: ubuntu-latest
    needs: layout-guard
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hwpx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hwpx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P1_PUBLIC_BASE_URL: http://127.0.0.1:8000
      P11_OAUTH_PASSPHRASE: ci-p2-oauth-passphrase
      P1_DOWNLOAD_SECRET: ci-download-secret
      P12_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hwpx
      P12_STATE_SECRET: ci-p12-state-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      P414_ALLOW_TEST_RECEIPTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact-head runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Full Python test collection after test relocation
        run: python -m pytest -q
      - name: Legacy standalone client compatibility entrypoint
        run: python tests/test_client.py
