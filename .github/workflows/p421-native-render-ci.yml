name: P4.21 prospective native-render shadow-court
on:
  pull_request:
    branches: ["main"]
    paths:
      - "hwpx_mcp/quality/p421_prospective_render_court.py"
      - "hwpx_mcp/quality/p421_renderer_qualification.py"
      - "hwpx_mcp/quality/p421_professional_authoring_review.py"
      - "hwpx_mcp/quality/p421_composite_workflow.py"
      - "hwpx_mcp/document/p321_document_composer.py"
      - "tests/test_p421_prospective_render_court.py"
      - "tests/test_p421_renderer_qualification.py"
      - "tests/test_p421_professional_authoring_review.py"
      - "tests/test_p421_composite_workflow.py"
      - "tests/test_p421_public_authoring_surface.py"
      - "tests/test_p421_public_api_live_integration.py"
      - "server_p2.py"
      - "benchmarks/p421_renderer_qualification.json"
      - "corpus/p421_candidate_intake.json"
      - "scripts/p421_acquire_public_fixture.py"
      - "tests/test_p421_acquire_public_fixture.py"
      - "benchmarks/p421_byte_acquisition_registration.json"
      - "benchmarks/p421_preregistration.json"
      - "docs/P421_NATIVE_RENDER_FIDELITY_RESEARCH_CHARTER.md"
      - ".github/workflows/p421-native-render-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p421-shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prospective-shadow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: p421_ci
          POSTGRES_PASSWORD: p421_ci_only
          POSTGRES_DB: p421_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p421_ci -d p421_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      P344_GATE_BIN: rust/p344_gate/target/release/p344-gate
      P345_REPLAY_BIN: rust/p345_replay/target/release/p345-replay
      P345_TS_RUNTIME: .tmp/p345-ts/scripts/p345_runtime_cli.js
      P346_GUARD_BIN: rust/p346_guard/target/release/p346-guard
      P346_TS_RUNTIME: .tmp/p345-ts/scripts/p346_platform_cli.js
      P347_CERTIFIER_BIN: rust/p347_certifier/target/release/p347-certifier
      P347_TS_RUNTIME: .tmp/p345-ts/scripts/p347_supply_chain_cli.js
      P348_VERIFIER_BIN: rust/p348_marketplace_verifier/target/release/p348-marketplace-verifier
      P348_TS_RUNTIME: .tmp/p345-ts/scripts/p348_marketplace_cli.js
      P349_TS_RUNTIME: .tmp/p345-ts/scripts/p349_composition_cli.js
      P12_AUTH_DATABASE_URL: postgresql://p421_ci:p421_ci_only@127.0.0.1:5432/p421_ci
      P12_STATE_SECRET: p421-ci-ephemeral-secret-not-for-production-20261012
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source HEAD
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify native research court Python syntax
        run: |
          python -m compileall -q hwpx_mcp/quality/p421_prospective_render_court.py tests/test_p421_prospective_render_court.py
      - name: Install only shadow test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Run negative controls and preregistration audit
        run: python -m pytest -q tests/test_p421_prospective_render_court.py tests/test_p421_renderer_qualification.py tests/test_p421_acquire_public_fixture.py tests/test_p421_professional_authoring_review.py tests/test_p421_public_authoring_surface.py
      - name: Install native HWPX package for composite integration tests
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build server platform TypeScript kernels
        run: |
          mkdir -p .tmp/p345-ts
          npx --yes -p typescript@5.9.2 tsc --strict --target ES2022 --module commonjs --rootDir . --outDir .tmp/p345-ts contracts/p345_runtime.ts contracts/p345_extension_sdk.ts scripts/p345_runtime_cli.ts contracts/p346_capability_kernel.ts contracts/p346_extension_sdk.ts scripts/p346_platform_cli.ts contracts/p347_supply_chain_kernel.ts scripts/p347_supply_chain_cli.ts contracts/p348_marketplace_kernel.ts scripts/p348_marketplace_cli.ts contracts/p349_composition_kernel.ts scripts/p349_composition_cli.ts
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sandbox-only native host gates
        run: |
          cargo build --release --manifest-path rust/p344_gate/Cargo.toml
          cargo build --release --manifest-path rust/p345_replay/Cargo.toml
          cargo build --release --manifest-path rust/p346_guard/Cargo.toml
          cargo build --release --manifest-path rust/p347_certifier/Cargo.toml
          cargo build --release --manifest-path rust/p348_marketplace_verifier/Cargo.toml
      - name: Run real composition and bounded repair regression
        run: python -m pytest -q tests/test_p421_composite_workflow.py tests/test_p421_public_api_live_integration.py
      - name: Download and verify pinned new rival fixture bytes (not Pilot enrollment)
        continue-on-error: true
        run: python scripts/p421_acquire_public_fixture.py --receipt "$RUNNER_TEMP/p421-acquisition-receipt.json"
      - name: Publish receipt only, never third-party HWPX bytes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p421-rival-fixture-byte-receipt
          path: ${{ runner.temp }}/p421-acquisition-receipt.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify no actual native evidence was claimed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hwpx_mcp.quality.p421_prospective_render_court import registration_contract
          manifest = json.loads(Path("benchmarks/p421_preregistration.json").read_text(encoding="utf-8"))
          assert len(manifest["cases"]) == len(registration_contract()["slots"]) == 36
          assert manifest["independent_native_captures_collected"] == 0
          assert manifest["independent_human_reviews_collected"] == 0
          assert all(case["source_sha256"] is None for case in manifest["cases"])
          print("P4.21 prospective protocol: NO_NATIVE_OR_HUMAN_EVIDENCE")
          PY
