name: P4.25 native HWPX product workflows

on:
  pull_request:
    branches: [development/p424-native-production-agent-20261105]
    paths:
      - "hwpx_mcp/interfaces/p425_*.py"
      - "hwpx_mcp/document/p321_document_composer.py"
      - "hwpx_mcp/orchestration/p338_rich_builder.py"
      - "tests/test_p425_*.py"
      - ".github/workflows/p425-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p425-workflows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out HEAD
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native HWPX and MCP runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile P4.25 tool and test modules
        run: |
          python -m compileall -q hwpx_mcp/interfaces/p425_competitive_workflows.py hwpx_mcp/interfaces/p425_format_interchange.py hwpx_mcp/interfaces/p425_report_presets.py tests/test_p425_competitive_workflows.py tests/test_p425_format_interchange.py tests/test_p425_report_presets.py
      - name: Run targeted native HWPX product tests
        run: |
          python -m unittest discover -s tests -p 'test_p425_*.py' -v
