name: P4.26 real external SVG renderer acceptance

on:
  pull_request:
    branches: [development/p425-competitive-capability-convergence-20261110]
    paths:
      - "scripts/p426_generate_native_showcase.py"
      - "scripts/p426_render_native_showcase.py"
      - "hwpx_mcp/render/p426_rhwp_svg_preview.py"
      - ".github/workflows/p426-real-svg-render-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p426-real-svg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-rhwp-render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual native HWPX authoring dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Create authentic P4.26 synthetic HWPX from repository code
        run: python -m scripts.p426_generate_native_showcase --output-dir p426-render-source
      - name: Download and SHA-pin independent rhwp v0.8.7 Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent             --retry 3 --connect-timeout 20 --max-time 180             "https://github.com/edwardkim/rhwp/releases/download/v0.8.7/rhwp-v0.8.7-linux-x86_64.tar.gz"             -o "$RUNNER_TEMP/rhwp-v0.8.7-linux-x86_64.tar.gz"
          echo "f1e541a25cfe76b6bc1daf18bf9c1f9a5ac5e03e2c01b188daaf54107214f631  $RUNNER_TEMP/rhwp-v0.8.7-linux-x86_64.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/p426-rhwp"
          tar -xzf "$RUNNER_TEMP/rhwp-v0.8.7-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/p426-rhwp"
          mapfile -t bins < <(find "$RUNNER_TEMP/p426-rhwp" -type f -name rhwp)
          test "${#bins[@]}" -eq 1
          chmod +x "${bins[0]}"
          printf 'RHWP_PATH=%s\n' "${bins[0]}" >> "$GITHUB_ENV"
          "${bins[0]}" --version
      - name: Install Korean glyph fallback and vector-to-PNG viewer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk librsvg2-bin fontconfig
          fc-cache -f
          fc-match "Noto Serif CJK KR"
      - name: Render real SVG pages and record observed pagination
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.p426_render_native_showcase             --source "p426-render-source/P426_합성_전기회로_분할개선보고서.hwpx"             --output-dir "p426-real-svg-pages"             --executable "$RHWP_PATH"             --pages 10
      - name: Generate portable PNG previews with installed Korean fonts
        shell: bash
        run: |
          set -euo pipefail
          find p426-real-svg-pages -type f -name '*.svg' -print0 | while IFS= read -r -d '' svg; do
            rsvg-convert "$svg" -o "${svg%.svg}.png"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("p426-real-svg-pages")
          manifest = json.loads((root / "p426_rhwp_render_observation.json").read_text(encoding="utf-8"))
          assert manifest["svg_pages"], "No rendered pages"
          for page in manifest["svg_pages"]:
              svg = root / page["relative_svg_path"]
              png = svg.with_suffix(".png")
              assert svg.is_file() and png.is_file(), (svg, png)
              assert png.read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          print("Real rhwp pages:", len(manifest["svg_pages"]))
          print("Observed rhwp table-cell text overflow lines:", manifest["total_overflow_cell_lines"])
          PY
      - name: Compare 20-row 28-row and 36-row budgets in actual renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p426-segmentation-benchmark
          for budget in 28 36; do
            mkdir -p "p426-segmentation-benchmark/$budget/source"
            python -m scripts.p426_generate_native_showcase               --output-dir "p426-segmentation-benchmark/$budget/source"               --table-segment-rows "$budget"
            python -m scripts.p426_render_native_showcase               --source "p426-segmentation-benchmark/$budget/source/P426_합성_전기회로_${budget}행분할.hwpx"               --output-dir "p426-segmentation-benchmark/$budget/svg"               --executable "$RHWP_PATH"               --pages 10
          done
          python - <<'PY'
          import json
          from pathlib import Path
          rows = []
          root = Path("p426-segmentation-benchmark")
          for budget in (20, 28, 36):
              if budget == 20:
                  path = Path("p426-real-svg-pages/p426_rhwp_render_observation.json")
              else:
                  path = root / str(budget) / "svg" / "p426_rhwp_render_observation.json"
              m = json.loads(path.read_text(encoding="utf-8"))
              rows.append({
                  "max_rows_per_table": budget,
                  "reported_page_count": m["page_count_reported"],
                  "rendered_pages": len(m["svg_pages"]),
                  "overflow_cell_lines": m["total_overflow_cell_lines"],
                  "renderer": m["engine"],
              })
          (root / "page-budget-comparison.json").write_text(
              json.dumps({"data": rows,
                          "authority": "INDEPENDENT_RHWP_RENDERER_NOT_HANCOM"}, indent=2) + "\n",
              encoding="utf-8",
          )
          print("P4.26 measured segmentation budgets:", json.dumps(rows))
          PY
      - name: Upload actual rhwp SVG and observed render manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p426-real-rhwp-svg-${{ github.run_number }}
          path: |
            p426-real-svg-pages/
            p426-segmentation-benchmark/
            p426-render-source/P426_생성검증_manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce no rhwp-rendered table text clipping
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("p426-real-svg-pages/p426_rhwp_render_observation.json").read_text(encoding="utf-8"))
          assert result["svg_pages"], "No SVG pages"
          assert result["total_overflow_cell_lines"] == 0, (
              "Real renderer reported clipped table lines: "
              + str(result["total_overflow_cell_lines"])
          )
          print("No clipped cell lines reported across all observed SVG pages")
          PY
