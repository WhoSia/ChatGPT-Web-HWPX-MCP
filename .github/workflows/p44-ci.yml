name: P4.4 durable release-health intelligence
on:
  push:
    branches: [main]
    paths:
      - "p44_*"
      - "test_p44_*"
      - "scripts/p44_*"
      - "benchmarks/p44_*"
      - "corpus/p44-*"
      - "corpus/p43-immutable-external-fixtures.json"
      - "server_p2.py"
      - "Dockerfile"
      - "tests/test_client.py"
      - "scripts/verify_production_boundary.py"
      - ".github/workflows/p44-ci.yml"
      - ".github/workflows/p1-ci.yml"
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          python -m compileall -q hwpx_mcp/quality/p44_health_intelligence.py hwpx_mcp/quality/p44_health_store.py p44_mcp.py tests/test_p44_health_intelligence.py tests/test_p44_health_store.py tests/test_p44_mcp.py scripts/p44_release_smoke.py
          python -m pytest -q tests/test_p44_health_intelligence.py tests/test_p44_mcp.py
          python scripts/p44_release_smoke.py
  durable-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: p44, POSTGRES_PASSWORD: p44, POSTGRES_DB: p44}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U p44 -d p44"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P44_TEST_DATABASE_URL: postgresql://p44:p44@127.0.0.1:5432/p44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_p44_health_store.py
      - run: |
          python - <<'PY'
          import os
          from p44_health_store import DurableHealthIntelligenceStore
          s=DurableHealthIntelligenceStore(os.environ["P44_TEST_DATABASE_URL"])
          r=s.bootstrap()
          assert r["release_count"]>=3
          assert r["corpus_count"]>=10
          assert any(x["exact_head"]=="a970def5bb92db5592b9e0e235baa98a8cd9ba1e" for x in s.query_release_observations(limit=1000))
          r2=s.bootstrap()
          assert r2["release_inserted"]==0 and r2["corpus_inserted"]==0
          print(r2)
          PY
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t hwpx-mcp-p44:${{ github.sha }} .
      - run: docker run --rm --entrypoint /bin/sh hwpx-mcp-p44:${{ github.sha }} -c 'python scripts/p44_release_smoke.py'
  p44-gate:
    needs: [unit, durable-store, docker-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/p44_release_smoke.py
      - run: echo "P4.4 durable release-health intelligence gate PASS"
