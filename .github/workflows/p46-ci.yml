name: P4.6 native authoring fidelity and ergonomics
on:
  push:
    branches: [main]
    paths:
      - "p46_*"
      - "test_p46_*"
      - "scripts/p46_*"
      - "server_p2.py"
      - "Dockerfile"
      - "test_client.py"
      - ".github/workflows/p46-ci.yml"
      - ".github/workflows/p1-ci.yml"
      - "scripts/verify_production_boundary.py"
permissions: {contents: read}
jobs:
  native-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q p46_native_authoring.py p46_mcp.py test_p46_native_authoring.py test_p46_mcp.py scripts/p46_release_smoke.py
      - run: python -m pytest -q test_p46_native_authoring.py test_p46_mcp.py
      - run: python scripts/p46_release_smoke.py
  docker-exact-head:
    runs-on: ubuntu-latest
    needs: native-authoring
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t hwpx-mcp-p46:${{ github.sha }} .
      - run: docker run --rm --entrypoint /bin/sh hwpx-mcp-p46:${{ github.sha }} -c 'python scripts/p46_release_smoke.py'
