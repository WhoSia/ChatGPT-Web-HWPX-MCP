name: P4.6 native authoring fidelity and ergonomics
on:
  push:
    branches: [main]
    paths:
      - "p46_*"
      - "test_p46_*"
      - "scripts/p46_*"
      - "server_p2.py"
      - "Dockerfile"
      - "tests/test_client.py"
      - ".github/workflows/p46-ci.yml"
      - ".github/workflows/p1-ci.yml"
      - "scripts/verify_production_boundary.py"
      - "skills/hwpx-authoring/SKILL.md"
      - "docs/p46-native-authoring.md"
permissions: {contents: read}
jobs:
  native-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q p46_native_authoring.py p46_mcp.py tests/test_p46_native_authoring.py tests/test_p46_mcp.py scripts/p46_release_smoke.py scripts/p46_real_document_benchmark.py
      - run: python -m pytest -q tests/test_p46_native_authoring.py tests/test_p46_mcp.py
      - run: python scripts/p46_release_smoke.py
      - run: python scripts/p46_real_document_benchmark.py --out /tmp/p46-real-documents
      - uses: actions/upload-artifact@v4
        with:
          name: p46-real-documents
          path: /tmp/p46-real-documents
  docker-exact-head:
    runs-on: ubuntu-latest
    needs: native-authoring
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t hwpx-mcp-p46:${{ github.sha }} .
      - run: docker run --rm --entrypoint /bin/sh hwpx-mcp-p46:${{ github.sha }} -c 'python scripts/p46_release_smoke.py'
