name: P4.7 render-grounded unified authoring
on:
  push:
    branches: [main]
    paths:
      - "p47_*"
      - "test_p47_*"
      - "scripts/p47_*"
      - "docs/p47-*"
      - "server_p2.py"
      - "Dockerfile"
      - "test_client.py"
      - ".github/workflows/p47-ci.yml"
      - ".github/workflows/p1-ci.yml"
      - "scripts/verify_production_boundary.py"
      - "skills/hwpx-authoring/SKILL.md"
permissions: {contents: read}
jobs:
  p47-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q p47_native_authoring.py p47_mcp.py test_p47_native_authoring.py test_p47_mcp.py scripts/p47_materialize_equation_capture_pack.py scripts/p47_release_smoke.py
      - run: python -m pytest -q test_p47_native_authoring.py test_p47_mcp.py
      - run: python scripts/p47_release_smoke.py
      - run: python scripts/p47_materialize_equation_capture_pack.py --out /tmp/p47-equation-capture-pack
      - uses: actions/upload-artifact@v4
        with:
          name: p47-equation-capture-pack
          path: /tmp/p47-equation-capture-pack
  docker-exact-head:
    runs-on: ubuntu-latest
    needs: p47-authoring
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t hwpx-mcp-p47:${{ github.sha }} .
      - run: docker run --rm --entrypoint /bin/sh hwpx-mcp-p47:${{ github.sha }} -c 'python scripts/p47_release_smoke.py'
