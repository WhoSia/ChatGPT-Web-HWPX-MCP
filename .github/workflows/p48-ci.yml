name: P4.8 semantic document components
on:
  push:
    branches: [main]
    paths:
      - "p48_*"
      - "p49_*"
      - "test_p49_*"
      - "test_p48_*"
      - "scripts/p48_*"
      - "docs/p48-*"
      - "server_p2.py"
      - "Dockerfile"
      - "tests/test_client.py"
      - "README.md"
      - ".github/workflows/p48-ci.yml"
      - ".github/workflows/p1-ci.yml"
      - "scripts/verify_production_boundary.py"
      - "skills/hwpx-authoring/SKILL.md"
permissions: {contents: read}
jobs:
  component-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q hwpx_mcp/rendering/p48_components.py p48_mcp.py p49_visual_conformance.py tests/test_p48_components.py tests/test_p48_mcp.py tests/test_p49_visual_conformance.py scripts/p48_release_smoke.py scripts/p48_component_benchmark.py
      - run: python -m pytest -q tests/test_p48_components.py tests/test_p48_mcp.py tests/test_p49_visual_conformance.py
      - run: python scripts/p48_release_smoke.py
      - run: python scripts/p48_component_benchmark.py --out /tmp/p48-component-benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: p48-component-benchmark
          path: /tmp/p48-component-benchmark
  docker-exact-head:
    runs-on: ubuntu-latest
    needs: component-authoring
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t hwpx-mcp-p48:${{ github.sha }} .
      - run: docker run --rm --entrypoint /bin/sh hwpx-mcp-p48:${{ github.sha }} -c 'python scripts/p48_release_smoke.py && python scripts/p48_component_benchmark.py --out /tmp/p48-benchmark >/dev/null'
