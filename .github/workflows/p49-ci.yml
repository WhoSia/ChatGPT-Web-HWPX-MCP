name: P4.9 native visual conformance
on:
  push:
    branches: [main]
    paths:
      - "p49_*"
      - "test_p49_*"
      - "scripts/p49_*"
      - "p48_components.py"
      - "p48_mcp.py"
      - "tests/test_p48_components.py"
      - "tests/test_p48_mcp.py"
      - "scripts/p48_release_smoke.py"
      - "scripts/p48_component_benchmark.py"
      - "Dockerfile"
      - ".github/workflows/p49-ci.yml"
permissions: {contents: read}
jobs:
  visual-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q p48_components.py p48_mcp.py p49_visual_conformance.py p49_equation_witnesses.py tests/test_p48_components.py tests/test_p48_mcp.py tests/test_p49_visual_conformance.py tests/test_p49_equation_witnesses.py tests/test_p49_capture_contract.py scripts/p48_release_smoke.py scripts/p48_component_benchmark.py scripts/p49_release_smoke.py scripts/p49_materialize_equation_witnesses.py
      - run: python -m pytest -q tests/test_p48_components.py tests/test_p48_mcp.py tests/test_p49_visual_conformance.py tests/test_p49_equation_witnesses.py tests/test_p49_capture_contract.py
      - run: python scripts/p48_release_smoke.py
      - run: python scripts/p49_release_smoke.py
      - run: python scripts/p49_materialize_equation_witnesses.py --out /tmp/p49-equation-witness
      - run: python scripts/p48_component_benchmark.py --out /tmp/p49-component-benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: p49-opening-evidence
          path: |
            /tmp/p49-equation-witness
            /tmp/p49-component-benchmark
  docker-exact-head:
    runs-on: ubuntu-latest
    needs: visual-conformance
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t hwpx-mcp-p49:${{ github.sha }} .
