name: Release SBOM, rights and runtime boundary
on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "scripts/release_artifact_audit.py"
      - ".github/workflows/release-sbom-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install environment and SBOM tooling
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt 'cyclonedx-bom==5.4.0' 'pip-licenses==5.3.0'
          python -m pip check
      - name: Materialize exact resolved dependency and license inventories
        run: |
          mkdir -p release-audit
          python -m pip freeze --all > release-audit/python-resolved.txt
          cyclonedx-py environment --output-format JSON --output-file release-audit/cyclonedx-python.json
          pip-licenses --format=json --with-urls --with-license-file --output-file release-audit/python-licenses.json
          python scripts/release_artifact_audit.py --report release-audit/audit.json
      - name: Package inventories only, not external data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-python-sbom-and-licenses
          path: release-audit/
          if-no-files-found: warn
          retention-days: 14
