name: RITHM S02.13-R1 outcome-blind admission-meter audit

on:
  push:
    branches: [rithm-s02-13-r1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Download sealed T120 raw artifacts from original S02.13 run
        uses: actions/download-artifact@v4
        with:
          pattern: s02-13-T120-p*
          path: cells
          repository: WhoSia/ChatGPT-Web-HWPX-MCP
          run-id: 34798945958
          github-token: ${{ github.token }}

      - name: Parse instrumentation only — duration forbidden
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import json, statistics, collections

          ps=['000','030','070','100']

          def load(p):
              f=Path('cells')/f's02-13-T120-p{p}'/'tripinfo.xml'
              assert f.exists(), f'MISSING {f}'
              all_ids=set(); elig=set(); routing_device=set(); excluded=set()
              vtypes={}; depart={}; raw_devices={}
              for _,e in ET.iterparse(f,events=('end',)):
                  if e.tag!='tripinfo':
                      e.clear(); continue
                  # OUTCOME FIREWALL: duration, waitingTime, timeLoss, routeLength,
                  # arrival and rerouteNo are intentionally never accessed.
                  vid=e.attrib.get('id','')
                  vt=e.attrib.get('vType',e.attrib.get('vtype',''))
                  devices=e.attrib.get('devices','')
                  dep=e.attrib.get('depart','-1')
                  all_ids.add(vid); vtypes[vid]=vt; raw_devices[vid]=devices
                  try: depart[vid]=float(dep)
                  except ValueError: depart[vid]=-1.0
                  if vt in {'bus','train'}:
                      excluded.add(vid)
                  else:
                      elig.add(vid)
                      if f'routing_{vid}' in devices:
                          routing_device.add(vid)
                  e.clear()
              return dict(all_ids=all_ids,eligible=elig,routing=routing_device,
                          excluded=excluded,vtypes=vtypes,depart=depart,devices=raw_devices)

          def family(vid):
              for pref in ['bus_','train_','commercial_','pedestrian_','special_','France:','Italy:','Monaco:']:
                  if vid.startswith(pref): return pref.rstrip('_:')
              return vid.split('_',1)[0].split('.',1)[0]

          def fam_counts(ids):
              return dict(sorted(collections.Counter(family(v) for v in ids).items()))

          d={p:load(p) for p in ps}
          common_all=set.intersection(*(d[p]['all_ids'] for p in ps))
          common_elig=set.intersection(*(d[p]['eligible'] for p in ps))
          base=d['000']; full=d['100']

          report={
            'seal':'S02.13-R1 OUTCOME-BLIND INSTRUMENTATION ONLY',
            'source_run':34798945958,
            'duration_read':False,
            'forbidden_attributes_read':[],
            'routing_device_detector':'exact substring routing_<vehicleID>',
            'cells':{}, 'universe':{}, 'cohort_common_eligible':{}, 'classification':{}
          }

          for p in ps:
              x=d[p]
              report['cells'][p]={
                'all_tripinfo_n':len(x['all_ids']),
                'eligible_n':len(x['eligible']),
                'excluded_bus_train_n':len(x['excluded']),
                'routing_device_n':len(x['routing']),
                'routing_device_fraction_eligible':len(x['routing'])/max(1,len(x['eligible'])),
                'departed_n':sum(v>=0 for v in x['depart'].values()),
                'undeparted_n':sum(v<0 for v in x['depart'].values()),
                'device_string_examples':sorted({x['devices'][v] for v in sorted(x['all_ids']) if x['devices'][v]})[:5]
              }

          report['universe']['all_id_sets_stable']=all(d[p]['all_ids']==base['all_ids'] for p in ps)
          report['universe']['eligible_id_sets_stable']=all(d[p]['eligible']==base['eligible'] for p in ps)
          report['universe']['common_all_n']=len(common_all)
          report['universe']['common_eligible_n']=len(common_elig)
          report['universe']['all_id_symmetric_difference_vs_p000']={p:len(d[p]['all_ids']^base['all_ids']) for p in ps[1:]}
          report['universe']['eligible_symmetric_difference_vs_p000']={p:len(d[p]['eligible']^base['eligible']) for p in ps[1:]}
          report['universe']['vtype_changes_on_common_all_vs_p000']={
              p:sum(base['vtypes'][v]!=d[p]['vtypes'][v] for v in (base['all_ids']&d[p]['all_ids'])) for p in ps[1:]}
          report['universe']['excluded_bus_train_counts']={p:len(d[p]['excluded']) for p in ps}

          only100=full['all_ids']-base['all_ids']
          only000=base['all_ids']-full['all_ids']
          dep100=[full['depart'][v] for v in only100 if full['depart'][v]>=0]
          dep000=[base['depart'][v] for v in only000 if base['depart'][v]>=0]
          report['universe']['p100_not_p000']={
              'n':len(only100),'families':fam_counts(only100),'sample':sorted(only100)[:50],
              'depart_min':min(dep100) if dep100 else None,
              'depart_median':statistics.median(dep100) if dep100 else None,
              'depart_max':max(dep100) if dep100 else None
          }
          report['universe']['p000_not_p100']={
              'n':len(only000),'families':fam_counts(only000),'sample':sorted(only000)[:50],
              'depart_min':min(dep000) if dep000 else None,
              'depart_median':statistics.median(dep000) if dep000 else None,
              'depart_max':max(dep000) if dep000 else None
          }

          E={p:(d[p]['routing'] & common_elig) for p in ps}
          report['cohort_common_eligible']={
              'n':len(common_elig),
              'routing_device_n':{p:len(E[p]) for p in ps},
              'routing_device_fraction':{p:len(E[p])/max(1,len(common_elig)) for p in ps},
              'routing_presence_nested_0_30_70_100':E['000']<=E['030']<=E['070']<=E['100'],
              'routing_presence_p0_nonempty':len(E['000'])>0,
              'routing_presence_p100_full':E['100']==common_elig,
              'p0_not_p30_n':len(E['000']-E['030']),
              'p30_not_p70_n':len(E['030']-E['070']),
              'p70_not_p100_n':len(E['070']-E['100'])
          }

          report['classification']={
              'old_zero_equipment_is_definite_token_mismatch':report['cells']['100']['routing_device_n']>0,
              'routing_presence_is_not_probability_cohort':report['cells']['000']['routing_device_n']>0,
              'reason':'VEHPARS_FORCE_REROUTE also constructs routing_<id>; device presence conflates forced pre-insertion routing with probability-selected periodic rerouting',
              'period_sidecar_required':True,
              'stable_universe_issue_independent':not report['universe']['eligible_id_sets_stable'],
              'vtype_redraw_explanation_rejected':all(v==0 for v in report['universe']['vtype_changes_on_common_all_vs_p000'].values()),
              'scientific_target_scoring_authorized':False
          }

          Path('s02-13-r1-audit.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Upload immutable R1 audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: s02-13-r1-outcome-blind-audit
          path: s02-13-r1-audit.json
          if-no-files-found: error
          retention-days: 30
