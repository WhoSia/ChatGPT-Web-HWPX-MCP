name: RITHM S02.14-R1 outcome-blind frame audit

on:
  push:
    branches: [rithm-s02-14-r1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download immutable S02.14 preseal receipts
        uses: actions/download-artifact@v4
        with:
          name: s02-14-preseal-receipts
          path: seal
          repository: WhoSia/ChatGPT-Web-HWPX-MCP
          run-id: 34809646166
          github-token: ${{ github.token }}

      - name: Reconstruct frozen frame receipt only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib, json
          p=Path('seal/s02-14-eligible-frame.tsv')
          raw=p.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=='e62c94e400e4e868c8ec2d3f734801c56dd0ba03fa2c050f32e223e876c43293'
          text=raw.decode('utf-8')
          physical_lines=text.splitlines()
          with p.open(newline='') as f:
              reader=csv.DictReader(f,delimiter='\t')
              rows=list(reader)
          frame={}
          duplicate_ids=[]
          for row in rows:
              vid=row['id']
              if vid in frame: duplicate_ids.append(vid)
              frame[vid]=float(row['activation_time'])
          out={
            'target_outcome_read':False,
            'eligible_frame_sha256':sha,
            'bytes':len(raw),
            'physical_line_count':len(physical_lines),
            'header':physical_lines[0] if physical_lines else None,
            'fieldnames':reader.fieldnames,
            'dictreader_rows':len(rows),
            'unique_ids':len(frame),
            'duplicate_id_count':len(duplicate_ids),
            'expected_unique_ids':45822,
            'exact_parser_reconstruction_pass':len(frame)==45822 and len(rows)==45822 and not duplicate_ids,
          }
          Path('s02-14-r1-frame-audit.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          assert out['exact_parser_reconstruction_pass']
          PY

      - name: Upload R1 audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: s02-14-r1-frame-audit
          path: s02-14-r1-frame-audit.json
          if-no-files-found: error
          retention-days: 90
