services:
  - type: web
    name: chatgpt-web-hwpx-mcp-p0
    runtime: docker
    repo: https://github.com/WhoSia/ChatGPT-Web-HWPX-MCP
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: P11_OAUTH_PASSPHRASE
        sync: false
      - key: P12_AUTH_DATABASE_URL
        sync: false
      - key: P12_STATE_SECRET
        sync: false
      - key: P1_DOWNLOAD_SECRET
        generateValue: true
      - key: P1_DOC_TTL_SECONDS
        value: "1800"
      - key: P1_MAX_TEXT_CHARS
        value: "100000"
