[package]
name = "p348-marketplace-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
hex = "0.4"
zeroize = "=1.8.1"
base64ct = "=1.7.3"
serde_json = "1"
sha2 = "0.10"

[lib]
path = "src/lib.rs"

[[bin]]
name = "p348-marketplace-verifier"
path = "src/main.rs"
